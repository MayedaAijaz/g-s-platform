version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gsmedcure_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gsmedcure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsmedcure_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gsmedcure}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gsmedcure}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gsmedcure_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gsmedcure}:${POSTGRES_PASSWORD:-gsmedcure_dev}@postgres:5432/${POSTGRES_DB:-gsmedcure}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: gsmedcure_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  postgres_data:
